name: Build Geode Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # lets you trigger manually from GitHub's UI/app

jobs:
  build:
    runs-on: windows-latest  # Geode mods usually target Windows GD
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Geode CLI & build
        uses: geode-sdk/build-geode-mod@main
        with:
          combos: |
            [{"platform": "win", "geode": "nightly"}]

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-build
          path: build/**/*.geode
